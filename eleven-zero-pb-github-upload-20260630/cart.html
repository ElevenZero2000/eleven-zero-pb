<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your cart · Eleven Zero PB</title>
    <meta
      name="description"
      content="Review your saved Eleven Zero PB paddle listings, estimate shipping, and continue to secure checkout."
    />
    <link rel="stylesheet" href="./styles.css?v=20260722audit2" />
    <link rel="stylesheet" href="./cart.css?v=20260917compactcart1" />
    <link rel="stylesheet" href="./header-tweaks.css?v=20260722audit2" />
  </head>
  <body data-nav="cart">
    <div class="page-shell">
      <header class="site-header">
        <a class="brand-mark" href="./index.html" aria-label="Eleven Zero PB home">
          <img
            class="brand-logo brand-logo-header"
            src="./assets/logo-primary.png"
            alt="Eleven Zero"
          />
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="./index.html">Home</a>
          <a href="./shop.html">Shop</a>
          <a href="./account.html">Account</a>
          <a href="./sell.html">Sell</a>
        </nav>

        <div class="nav-auth-slot" data-auth-slot></div>
      </header>

      <main id="cart" class="cart-page">
        <section class="cart-hero reveal">
          <div class="cart-hero-copy">
            <h1>Your cart</h1>
            <p>Choose a paddle and confirm shipping before checkout.</p>
          </div>
        </section>

        <section class="cart-layout" aria-label="Cart and checkout">
          <div class="cart-items-panel reveal" data-cart-items-panel>
            <div class="cart-panel-loader">Loading your cart…</div>
          </div>

          <aside class="cart-checkout-panel reveal" data-cart-checkout-panel>
            <div class="cart-panel-loader">Preparing checkout…</div>
          </aside>
        </section>

        <div class="seller-status listing-detail-status" aria-live="polite" data-cart-status hidden></div>
      </main>

      <footer class="site-footer">
        <div class="footer-brand-block">
          <img
            class="brand-logo brand-logo-footer"
            src="./assets/logo-primary.png"
            alt="Eleven Zero"
          />
          <p class="footer-copy">
            A focused marketplace for buying and selling pickleball paddles
            with reviewed listings and clear checkout details.
          </p>
        </div>

        <div class="footer-links">
          <a href="./index.html">Home</a>
          <a href="./shop.html">Shop</a>
          <a href="./sell.html">Sell</a>
          <a href="./account.html">Account</a>
          <a href="./privacy.html">Privacy</a>
          <a href="./terms.html">Terms</a>
        </div>
      </footer>
    </div>

    <script src="./app.js?v=20260916marketfocus1"></script>
    <script src="./cart.js?v=20260917compactcart1"></script>
    <script src="./header-tweaks.js?v=20260916marketfocus1"></script>
  </body>
</html>
